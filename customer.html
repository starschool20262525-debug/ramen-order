<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>博来軒 注文画面</title>

<script src="https://js.pusher.com/8.3.0/pusher.min.js"></script>

<style>
body {
    font-family: "Meiryo", sans-serif;
    background: #f8f9fa;
    margin: 0;
    padding: 20px;
    color: #333;
    font-size: 22px;
}

h1 {
    text-align: center;
    color: #d9534f;
    font-size: 36px;
}

.hygiene {
    max-width: 800px;
    margin: 0 auto 20px;
    padding: 15px;
    background: #fff3cd;
    border: 2px solid #ffeeba;
    border-radius: 10px;
    text-align: center;
    font-weight: bold;
}

.menu-container {
    max-width: 800px;
    margin: auto;
}

.menu-item {
    background: white;
    border: 3px solid #ccc;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
}

.menu-item.soldout {
    background: #e9ecef;
    color: #777;
}

.menu-info {
    flex: 1;
}

.menu-name {
    font-size: 28px;
    font-weight: bold;
}

.menu-price {
    margin-top: 5px;
}

.controls {
    display: flex;
    align-items: center;
    gap: 15px;
}

.btn {
    width: 65px;
    height: 65px;
    font-size: 30px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.minus {
    background: #ddd;
}

.plus {
    background: #d9534f;
    color: white;
}

.count {
    min-width: 40px;
    text-align: center;
    font-size: 32px;
    font-weight: bold;
}

.soldout-badge {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) rotate(-8deg);
    background: #dc3545;
    color: white;
    padding: 8px 25px;
    border-radius: 8px;
    font-size: 32px;
    font-weight: bold;
}

.summary {
    max-width: 800px;
    margin: 30px auto;
    background: white;
    border: 4px solid #d9534f;
    border-radius: 15px;
    padding: 25px;
}

.summary-title {
    font-size: 30px;
    font-weight: bold;
    border-bottom: 3px solid #d9534f;
    padding-bottom: 10px;
    margin-bottom: 15px;
}

.summary-line {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
}

.total {
    border-top: 2px dashed #aaa;
    margin-top: 20px;
    padding-top: 15px;
    font-size: 34px;
    font-weight: bold;
    color: #d9534f;
}

.submit {
    width: 100%;
    margin-top: 25px;
    padding: 20px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 15px;
    font-size: 30px;
    font-weight: bold;
    cursor: pointer;
}

.status {
    max-width: 800px;
    margin: 15px auto;
    text-align: center;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="hygiene">
    いつもありがとうございます！<br>
    注文のまえに、手をきれいに洗っていただけると嬉しいです。
</div>

    <div class="table-select">
  <h2>🪑 座席番号をお選び下さい</h2>
  <div class="table-buttons">
  <button onclick="selectTable(1)">1番卓</button>
  <button onclick="selectTable(2)">2番卓</button>
  <button onclick="selectTable(3)">3番卓</button>
  <button onclick="selectTable(4)">4番卓</button>
</div>
<div id="selected-table">
  まだお席が選ばれていません
 </div>
</div>
    
<h1>🍜 ご注文をお選びください</h1>

<div id="status" class="status"></div>

<div class="menu-container">

    <div id="menu-list"></div>

    <div class="summary">

        <div class="summary-title">
            📝 えらんだもの
        </div>
