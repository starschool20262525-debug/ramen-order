<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ラーメン店 注文画面</title>

<script src="https://js.pusher.com/8.3.0/pusher.min.js"></script>

<style>
body {
    font-family: "Meiryo", sans-serif;
    background: #f8f9fa;
    margin: 0;
    padding: 20px;
    color: #333;
    font-size: 22px;
}

h1 {
    text-align: center;
    color: #d9534f;
    font-size: 36px;
}

.hygiene {
    max-width: 800px;
    margin: 0 auto 20px;
    padding: 15px;
    background: #fff3cd;
    border: 2px solid #ffeeba;
    border-radius: 10px;
    text-align: center;
    font-weight: bold;
}

.menu-container {
    max-width: 800px;
    margin: auto;
}

.menu-item {
    background: white;
    border: 3px solid #ccc;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
}

.menu-item.soldout {
    background: #e9ecef;
    color: #777;
}

.menu-info {
    flex: 1;
}

.menu-name {
    font-size: 28px;
    font-weight: bold;
}

.menu-price {
    margin-top: 5px;
}

.controls {
    display: flex;
    align-items: center;
    gap: 15px;
}

.btn {
    width: 65px;
    height: 65px;
    font-size: 30px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.minus {
    background: #ddd;
}

.plus {
    background: #d9534f;
    color: white;
}

.count {
    min-width: 40px;
    text-align: center;
    font-size: 32px;
    font-weight: bold;
}

.soldout-badge {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) rotate(-8deg);
    background: #dc3545;
    color: white;
    padding: 8px 25px;
    border-radius: 8px;
    font-size: 32px;
    font-weight: bold;
}

.summary {
    max-width: 800px;
    margin: 30px auto;
    background: white;
    border: 4px solid #d9534f;
    border-radius: 15px;
    padding: 25px;
}

.summary-title {
    font-size: 30px;
    font-weight: bold;
    border-bottom: 3px solid #d9534f;
    padding-bottom: 10px;
    margin-bottom: 15px;
}

.summary-line {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
}

.total {
    border-top: 2px dashed #aaa;
    margin-top: 20px;
    padding-top: 15px;
    font-size: 34px;
    font-weight: bold;
    color: #d9534f;
}

.submit {
    width: 100%;
    margin-top: 25px;
    padding: 20px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 15px;
    font-size: 30px;
    font-weight: bold;
    cursor: pointer;
}

.status {
    max-width: 800px;
    margin: 15px auto;
    text-align: center;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="hygiene">
    ✨ いつもありがとうございます！<br>
    注文のまえに、手をきれいに洗いましょう。
</div>

<h1>🍜 ご注文をお選びください</h1>

<div id="status" class="status"></div>

<div class="menu-container">

    <div id="menu-list"></div>

    <div class="summary">

        <div class="summary-title">
            📝 えらんだもの
        </div>

        <div id="summary-items">
            まだえらばれていません
        </div>

        <div class="summary-line total">
            <span>合計</span>
            <span id="total-price">0 円</span>
        </div>

        <button class="submit" onclick="submitOrder()">
            お店につたえる
        </button>

    </div>

</div>

<script>

// ==================================================
// Cloudflare Worker
// ==================================================

const WORKER_URL =
    "https://rame-order-api.starschool20262525.workers.dev";


// ==================================================
// Pusher
// ==================================================

const PUSHER_KEY =
    "bf49b4f0cec0367b306c";

const PUSHER_CLUSTER =
    "ap3";

const pusher = new Pusher(PUSHER_KEY, {
    cluster: PUSHER_CLUSTER,
    forceTLS: true
});


// ==================================================
// Pusherチャンネル
// ==================================================

const channel =
    pusher.subscribe("ramen-channel");


// ==================================================
// メニュー
// ==================================================

const menuData = [

    {
        id: "m1",
        name: "ラーメン",
        price: 700,
        available: true
    },

    {
        id: "m2",
        name: "チャーシューメン",
        price: 950,
        available: true
    },

    {
        id: "m3",
        name: "ギョーザ（5個）",
        price: 400,
        available: true
    },

    {
        id: "m4",
        name: "ライス",
        price: 150,
        available: true
    },

    {
        id: "m5",
        name: "【季節限定】冷やし中華",
        price: 850,
        available: false
    }

];


// ==================================================
// 注文数
// ==================================================

let order = {};

menuData.forEach(item => {
    order[item.id] = 0;
});


// ==================================================
// お店からの売り切れ情報
// ==================================================

channel.bind("menu-updated", function(data) {

    console.log("メニュー変更:", data);

    const item =
        menuData.find(item => item.id === data.id);

    if (!item) return;

    item.available =
        Boolean(data.available);

    // 売り切れになったら注文数を0にする
    if (!item.available) {
        order[item.id] = 0;
    }

    renderMenu();
    updateSummary();

    showStatus(
        item.name +
        (item.available
            ? " が販売再開しました"
            : " が売り切れになりました")
    );

});


// ==================================================
// メニュー表示
// ==================================================

function renderMenu() {

    const menuList =
        document.getElementById("menu-list");

    menuList.innerHTML = "";

    menuData.forEach(item => {

        const div =
            document.createElement("div");

        div.className =
            "menu-item " +
            (item.available ? "" : "soldout");


        let buttons = "";


        if (item.available) {

            buttons = `

                <button
                    class="btn minus"
                    onclick="changeQty('${item.id}', -1)">
                    −
                </button>

                <span
                    class="count"
                    id="qty-${item.id}">
                    ${order[item.id]}
                </span>

                <button
                    class="btn plus"
                    onclick="changeQty('${item.id}', 1)">
                    ＋
                </button>

            `;

        } else {

            buttons = `

                <span style="font-weight:bold;">
                    販売停止
                </span>

            `;

        }


        div.innerHTML = `

            ${
                item.available
                ? ""
                : '<div class="soldout-badge">うりきれ</div>'
            }

            <div class="menu-info">

                <div class="menu-name">
                    ${item.name}
                </div>

                <div class="menu-price">
                    ${item.price} 円
                </div>

            </div>

            <div class="controls">
                ${buttons}
            </div>

        `;

        menuList.appendChild(div);

    });

}


// ==================================================
// 個数変更
// ==================================================

function changeQty(id, change) {

    const item =
        menuData.find(item => item.id === id);

    if (!item || !item.available) {
        return;
    }


    order[id] += change;


    if (order[id] < 0) {
        order[id] = 0;
    }


    renderMenu();
    updateSummary();

}


// ==================================================
// 注文確認
// ==================================================

function updateSummary() {

    const summary =
        document.getElementById("summary-items");

    const totalElement =
        document.getElementById("total-price");


    summary.innerHTML = "";


    let total = 0;
    let hasItems = false;


    menuData.forEach(item => {

        const qty =
            order[item.id];


        if (qty > 0 && item.available) {

            hasItems = true;


            const itemTotal =
                item.price * qty;


            total += itemTotal;


            const line =
                document.createElement("div");

            line.className =
                "summary-line";


            line.innerHTML = `

                <span>
                    ${item.name} × ${qty}
                </span>

                <span>
                    ${itemTotal} 円
                </span>

            `;


            summary.appendChild(line);

        }

    });


    if (!hasItems) {

        summary.innerHTML =
            '<div style="text-align:center;color:#999;">' +
            'まだえらばれていません' +
            '</div>';

    }


    totalElement.innerText =
        total + " 円";

}


// ==================================================
// 注文送信
// ==================================================

async function submitOrder() {

    let total = 0;

    let items = [];


    menuData.forEach(item => {

        const qty =
            order[item.id];


        if (qty > 0 && item.available) {

            total +=
                item.price * qty;


            items.push({

                id: item.id,

                name: item.name,

                price: item.price,

                quantity: qty

            });

        }

    });


    // 商品がない場合
    if (items.length === 0) {

        alert(
            "商品を1つ以上えらんでください。"
        );

        return;

    }


    const now =
        new Date();


    const orderData = {

        id:
            Date.now().toString(),

        time:
            now.toLocaleTimeString(
                "ja-JP",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            ),

        items:
            items,

        total:
            total

    };


    // 二重送信防止
    const submitButton =
        document.querySelector(".submit");

    submitButton.disabled = true;

    submitButton.innerText =
        "送信しています...";


    try {

        const response =
            await fetch(
                WORKER_URL + "/order",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(orderData)

                }
            );


        const result =
            await response.json();


        console.log(
            "Worker response:",
            result
        );


        if (!response.ok || !result.ok) {

            throw new Error(
                result.error ||
                "注文送信に失敗しました"
            );

        }


        alert(
            "お店に注文をつたえました！\n" +
            "少々お待ちください。"
        );


        // 注文をリセット

        menuData.forEach(item => {
            order[item.id] = 0;
        });


        renderMenu();
        updateSummary();


    } catch (error) {

        console.error(
            "注文送信エラー:",
            error
        );


        alert(
            "注文を送信できませんでした。\n" +
            "お店の人に声をかけてください。"
        );


    } finally {

        submitButton.disabled = false;

        submitButton.innerText =
            "お店につたえる";

    }

}


// ==================================================
// ステータス表示
// ==================================================

function showStatus(message) {

    const status =
        document.getElementById("status");

    status.innerText =
        message;

    setTimeout(() => {

        status.innerText = "";

    }, 3000);

}


// ==================================================
// 初期表示
// ==================================================

renderMenu();
updateSummary();

</script>

</body>
</html>
