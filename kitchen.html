<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お店 注文確認画面</title>

<script src="https://js.pusher.com/8.3.0/pusher.min.js"></script>

<style>

body {
    font-family: "Meiryo", sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
    color: #d9534f;
}

.panel {
    max-width: 900px;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
}

.menu-button {
    width: 100%;
    margin: 8px 0;
    padding: 15px;

    border: none;
    border-radius: 10px;

    font-size: 22px;
    font-weight: bold;
}

.selling {
    background: #28a745;
    color: white;
}

.stopped {
    background: #dc3545;
    color: white;
}

.order {
    background: white;
    border: 3px solid #ccc;
    border-radius: 15px;

    padding: 20px;
    margin: 15px 0;
}

.order-header {
    display: flex;
    justify-content: space-between;

    font-size: 24px;
    font-weight: bold;

    border-bottom: 2px solid #ddd;
    padding-bottom: 10px;
}

.order-item {
    display: flex;
    justify-content: space-between;

    padding: 8px 0;
}

.order-total {
    border-top: 2px dashed #aaa;

    margin-top: 10px;
    padding-top: 10px;

    font-size: 25px;
    font-weight: bold;
    text-align: right;
}

.done {
    width: 100%;
    padding: 15px;

    background: #555;
    color: white;

    border: none;
    border-radius: 10px;

    font-size: 22px;
}

.empty {
    text-align: center;
    color: #888;
    padding: 30px;
}

</style>

</head>

<body>

<h1>👨‍🍳 お店の注文確認</h1>


<div class="panel">

<h2>🍜 メニュー販売状況</h2>

<div id="menu-controls"></div>

</div>


<div class="panel">

<h2>📝 届いた注文</h2>

<div id="orders">

<div class="empty">
まだ注文はありません
</div>

</div>

</div>


<script>

const WORKER_URL =
"https://rame-order-api.starschool20262525.workers.dev";

const PUSHER_KEY =
"bf49b4f0cec0367b306c";

const PUSHER_CLUSTER =
"ap3";


const menuData = [

{
id: "m1",
name: "ラーメン",
price: 700,
available: true
},

{
id: "m2",
name: "チャーシューメン",
price: 950,
available: true
},

{
id: "m3",
name: "ギョーザ（5個）",
price: 400,
available: true
},

{
id: "m4",
name: "ライス",
price: 150,
available: true
},

{
id: "m5",
name: "【季節限定】冷やし中華",
price: 850,
available: false
}

];


let orders = [];


// -------------------------
// Pusher
// -------------------------

const pusher =
    new Pusher(PUSHER_KEY, {
        cluster: PUSHER_CLUSTER
    });

const channel =
    pusher.subscribe("ramen-channel");


// 注文を受信

channel.bind("new-order", function(data) {

    orders.unshift(data);

    renderOrders();

    // 新しい注文が来たことを知らせる
    alert("新しい注文が届きました！");
});


// メニュー状態変更を受信

channel.bind("menu-updated", function(data) {

    const item =
        menuData.find(
            item => item.id === data.id
        );

    if (!item) return;

    item.available =
        data.available;

    renderMenuControls();
});


// -------------------------
// メニュー表示
// -------------------------

function renderMenuControls() {

    const container =
        document.getElementById(
            "menu-controls"
        );

    container.innerHTML = "";

    menuData.forEach(item => {

        const button =
            document.createElement("button");

        button.className =
            "menu-button " +
            (item.available
                ? "selling"
                : "stopped");

        button.innerText =
            item.name +
            " : " +
            (
                item.available
                ? "〇 販売中"
                : "✕ 販売停止"
            );

        button.onclick =
            () => toggleMenu(item);

        container.appendChild(button);
    });
}


// -------------------------
// 販売停止 / 再開
// -------------------------

async function toggleMenu(item) {

    const newStatus =
        !item.available;

    try {

        const response =
            await fetch(
                WORKER_URL + "/menu",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        id: item.id,
                        available: newStatus
                    })
                }
            );

        if (!response.ok) {

            throw new Error(
                await response.text()
            );
        }

        item.available =
            newStatus;

        renderMenuControls();

    } catch (error) {

        console.error(error);

        alert(
            "メニュー状態の変更に失敗しました。"
        );
    }
}


// -------------------------
// 注文表示
// -------------------------

function renderOrders() {

    const container =
        document.getElementById("orders");

    container.innerHTML = "";

    if (orders.length === 0) {

        container.innerHTML =
            '<div class="empty">' +
            'まだ注文はありません' +
            '</div>';

        return;
    }


    orders.forEach(order => {

        const div =
            document.createElement("div");

        div.className =
            "order";

        let itemsHTML = "";

        order.items.forEach(item => {

            itemsHTML += `

                <div class="order-item">

                    <span>
                        ${item.name}
                        × ${item.quantity}
                    </span>

                    <span>
                        ${item.price *
                          item.quantity} 円
                    </span>

                </div>
            `;
        });


        div.innerHTML = `

            <div class="order-header">

                <span>
                    注文
                </span>

                <span>
                    ${order.time}
                </span>

            </div>

            ${itemsHTML}

            <div class="order-total">
                合計 ${order.total} 円
            </div>

            <button
                class="done"
                onclick="removeOrder('${order.id}')">

                提供済みにする

            </button>
        `;

        container.appendChild(div);
    });
}


// -------------------------
// 注文を消す
// -------------------------

function removeOrder(id) {

    orders =
        orders.filter(
            order => order.id !== id
        );

    renderOrders();
}


// 初期表示

renderMenuControls();
renderOrders();

</script>

</body>
</html>
