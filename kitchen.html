<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>お店 注文確認画面</title>

  <style>
    body {
      font-family: "Meiryo", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #d9534f;
      font-size: 34px;
    }

    .status {
      text-align: center;
      font-weight: bold;
      margin: 15px;
    }

    .panel {
      max-width: 900px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-sizing: border-box;
    }

    .menu-button {
      width: 100%;
      margin: 8px 0;
      padding: 18px;

      border: none;
      border-radius: 10px;

      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .selling {
      background: #28a745;
      color: white;
    }

    .stopped {
      background: #dc3545;
      color: white;
    }

    .order-card {
      background: white;
      border: 3px solid #ccc;
      border-radius: 15px;

      padding: 20px;
      margin: 15px 0;
    }

    .order-card.completed {
      opacity: 0.55;
      border-color: #888;
    }

    .order-header {
      display: flex;
      justify-content: space-between;

      font-size: 24px;
      font-weight: bold;

      border-bottom: 2px solid #ddd;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .order-items {
      white-space: pre-wrap;
      font-size: 23px;
      line-height: 1.7;
      padding: 10px 0;
    }

    .order-total {
      border-top: 2px dashed #aaa;

      margin-top: 10px;
      padding-top: 10px;

      font-size: 25px;
      font-weight: bold;
      text-align: right;
    }

    .order-button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;

      background: #555;
      color: white;

      border: none;
      border-radius: 10px;

      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 30px;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <h1>👨‍🍳 お店の注文確認</h1>

  <div id="connection-status" class="status">
    通信に接続しています…
  </div>

  <div class="panel">

    <h2>🍜 メニュー販売状況</h2>

    <!-- app.js がここにメニューを表示 -->
    <div id="menu-buttons"></div>

  </div>

  <div class="panel">

    <h2>📝 届いた注文</h2>

    <!-- app.js がここに注文を表示 -->
    <div id="order-list">

      <div class="empty">
        まだ注文はありません
      </div>

    </div>

  </div>

  <!-- 共通JavaScript -->
  <script src="https://js.pusher.com/8.3.0/pusher.min.js"></script>
  <script src="./app.js"></script>

</body>
</html>
